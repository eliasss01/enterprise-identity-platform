spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/identity_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      url: redis://localhost:6379
  cache:
    type: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/enterprise-platform

  kafka:
    bootstrap-servers: localhost:9094