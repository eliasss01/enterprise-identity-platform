server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:coredb;MODE=Oracle
    driver-class-name: org.h2.Driver
    user: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
  
  flyway:
    enabled: true
        