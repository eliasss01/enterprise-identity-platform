openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0

paths:
  /api/v1/users:
    post:
      tags:
        - Users
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/v1/users/{id}:
    get:
      tags:
        - Users
      operationId: getUser
      parameters: # <--- CORRETTO (era paramenters)
        - name: id
          in: path
          required: true
          description: ID dell'utente
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Utente trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Utente non trovato

components:
  schemas:
    CreateUserRequest:
      type: object
      required: [email, fullName]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
    
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        active:
          type: boolean